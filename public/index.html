<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS 콘텐츠 대시보드</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">SNS 콘텐츠<small>브랜드마케팅파트</small></div>
    <nav id="nav"></nav>
    <div class="demo-note">⚠ 지금은 <b>가짜 데이터</b> 화면입니다.<br>실제 연결은 다음 단계에서 진행합니다.</div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="title"></h1>
      <div class="filters">
        <label>브랜드
          <select id="f-brand"></select>
        </label>
        <label>기간
          <select id="f-days">
            <option value="1주">최근 7일</option><option value="1개월" selected>최근 1개월</option><option value="3개월">최근 3개월</option>
            <option value="6개월">최근 6개월</option><option value="12개월">최근 12개월</option><option value="직접">직접 설정</option>
          </select>
        </label>
        <label>비교
          <select id="f-cmp"><option value="auto" selected>전주·작년 동기 자동</option><option value="custom">직접 설정</option></select>
        </label>
        <span id="f-cmpdate" style="display:none">비교 시작일 <input type="date" id="f-cmpstart"></span>
        <span id="f-custom" style="display:none"><input type="date" id="f-start"> – <input type="date" id="f-end"></span>
        <span class="hint" id="f-hint"></span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<script>
// 실데이터(/api/data)가 있으면 사용하고, 없으면(연결 전·미리보기) 샘플 데이터로 동작
fetch('api/data', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
  window.LIVE = d && !d.error ? d : null;
  return ['js/data.js', 'js/app.js'].reduce((p, s) => p.then(() => new Promise(res => { const e = document.createElement('script'); e.src = s; e.onload = res; document.body.appendChild(e); })), Promise.resolve());
});
</script>
</body>
</html>
